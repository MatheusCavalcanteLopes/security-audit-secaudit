name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test the built CLI
        run: node dist/cli.js --help

      - name: Self-audit (dogfooding — scan this repo for leaked secrets)
        run: node dist/cli.js secrets .
        continue-on-error: true # informational: test fixtures intentionally contain fake secrets
